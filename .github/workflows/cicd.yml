name: Build Docker Image & Deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          tags: |
            littlebirdd/mitr-frontend:latest
            littlebirdd/mitr-frontend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/mitr/frontend/
            docker compose pull
            docker compose up -d

  notify-success:
    needs: deploy
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - name: Sanitize Commit Message
        id: sanitize
        run: |
          msg="${{ github.event.head_commit.message }}"
          msg="${msg//$'\n'/ }"
          msg="${msg:0:300}"
          echo "msg=$msg" >> $GITHUB_OUTPUT

      - name: discord
        uses: rguillaume/discord-action-embed@v1.0.2
        with:
          webhook: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}
          message: "🚀 New deployment to **${{ github.repository }}** on `main`"
          embed: >
            {
              "color": 3066993,
              "title": "✅ Deployment Successful",
              "description": "**Commit:** ${{ steps.sanitize.outputs.msg }}",
              "url": "${{ github.event.head_commit.url }}",
              "author": {
                "name": "${{ github.actor }}",
                "icon_url": "https://github.com/${{ github.actor }}.png"
              },
              "fields": [
                {
                  "name": "🌐 App URL",
                  "value": "[Open App](https://icpc.cs.sci.ku.ac.th/2026)",
                  "inline": true
                },
                {
                  "name": "Commit ID",
                  "value": "`${{ github.sha }}`",
                  "inline": true
                }
              ],
              "footer": {
                "text": "GitHub Actions"
              },
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }

  notify-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: discord
        uses: rguillaume/discord-action-embed@v1.0.2
        with:
          webhook: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}
          message: "🚀 New deployment to **${{ github.repository }}** on `main`"
          embed: >
            {
              "color": 15158332,
              "title": "🚨 Deployment Failed",
              "description": "Build or Deploy step failed. Check logs in GitHub Actions.",
              "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "author": {
                "name": "${{ github.actor }}",
                "icon_url": "https://github.com/${{ github.actor }}.png"
              },
              "fields": [
                {
                  "name": "Commit ID",
                  "value": "`${{ github.sha }}`"
                }
              ],
              "footer": {
                "text": "GitHub Actions"
              },
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }
