services:
  frontend:
    image: littlebirdd/mitr-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: mitr-frontend-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', response => process.exit(response.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - mitr-network

networks:
  mitr-network:
    external: true
    name: mitr-network
    driver: bridge
