services:
  frontend:
    build:
      context: .
      target: development
    container_name: mitr-frontend-api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - mitr-network

networks:
  mitr-network:
    external: true
    name: mitr-network
    driver: bridge
